name: Feature request
description: Suggest a focused development or collaboration improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: Which concrete cross-device workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include CLI/API examples and acceptance criteria if available.
    validations:
      required: true
