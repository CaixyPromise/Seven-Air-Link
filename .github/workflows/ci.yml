name: Seven-Air-Link · Linux CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev
      - name: Unit tests and static analysis
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./...
          go vet ./...
      - name: Compile smoke test
        env:
          CGO_ENABLED: '1'
        run: |
          go build -buildvcs=false -o seven-air-link ./cmd/seven-air-link
          ./seven-air-link version
